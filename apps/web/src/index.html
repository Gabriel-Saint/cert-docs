<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>CertDocs</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Materiais em PDF com identificação do aluno e certificados verificáveis por código e QR Code."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      try {
        var theme = localStorage.getItem('cert-docs.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.classList.add('theme-' + theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
